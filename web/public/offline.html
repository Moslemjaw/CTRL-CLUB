<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00032E">
  <meta name="robots" content="noindex">
  <title>You're offline | CTRL</title>
  <link rel="icon" href="/icon.png">
  <style>
    * { box-sizing: border-box; }
    html { background: #00032e; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(70rem 40rem at 85% -10%, rgba(111, 203, 255, 0.16), transparent 60%),
        radial-gradient(50rem 30rem at 0% 100%, rgba(16, 26, 122, 0.8), transparent 70%),
        #00032e;
    }
    img { display: block; width: 112px; height: 112px; margin: 0 auto 32px; }
    .eyebrow {
      margin: 0 0 16px;
      font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #6fcbff;
    }
    h1 { margin: 0; font-size: clamp(2.25rem, 8vw, 3.5rem); font-weight: 700; line-height: 1.02; letter-spacing: -0.025em; text-wrap: balance; }
    .hint { margin: 16px 0 32px; color: rgba(255, 255, 255, 0.75); }
    button {
      min-height: 48px;
      padding: 12px 24px;
      border: 0;
      border-radius: 12px;
      background: #fff;
      color: #05072a;
      font: 600 16px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      box-shadow: 0 5px 0 #6fcbff;
      cursor: pointer;
    }
    button:active { transform: translateY(4px); box-shadow: 0 1px 0 #6fcbff; }
    button:focus-visible { outline: 2px solid #6fcbff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="CTRL">
    <p class="eyebrow">No connection</p>
    <h1>You're offline</h1>
    <p class="hint">Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>
    addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
